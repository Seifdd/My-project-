name: Build Android APK from Zip

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Zip and Build APK
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Found zip file: $f, extracting..."
            unzip -o "$f" -d extracted_project
          fi
        done

        PROJECT_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: build.gradle.kts not found inside the zip!"
          exit 1
        fi

        echo "Project located at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
